[project]
name = "jimmyjenk"
version = "0.1.0"
description = "JimmyJenk: a local harness for Jev-style System-One decisions (Noul / Choice / Score) built on any LLM's token logprobs"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "pydantic>=2", "pyyaml", "numpy", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
